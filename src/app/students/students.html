<div class="container">
  <hr>

  <h2>Students List</h2>

  @for (student of students(); track student._id) {

    <a
      [routerLink]="['/students', student._id]"
      class="student-card"
      [ngClass]="{
        'selected-student':
          selectedStudent()?._id === student._id
      }">

      <strong>{{student.name}}</strong>

    </a>
  }

  <hr>

</div>
