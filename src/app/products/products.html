<button mat-raised-button>
  Add Product
</button>

<mat-card>
  <mat-card-header>
    <mat-card-title>Angular Material Card</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    Test Card
  </mat-card-content>
</mat-card>

<mat-form-field>
  <mat-label>Product Name</mat-label>
  <input matInput>
</mat-form-field>


<div class="container mt-4">

    <div class="row">

        @for(product of products; track product.id){

            <div class="col-md-4 mb-4">

                <div class="card h-100">

                    <img
                        [src]="product.imgUrl"
                        class="card-img-top"
                        alt="product image">

                    <div class="card-body">

                        <h5 class="card-title">
                            {{product.name}}
                        </h5>

                        <p>
                            Price: {{product.price}}
                        </p>

                        @if(product.quantity == 0){

                      <p  class="text-danger">Out Of Stock</p>

                            }
                      @else if(product.quantity == 1){

                      <p  class="text-warning">Last Item</p>

                     }
                      @else{

                      <p class="text-success" >In Stock</p>

                      }

                    </div>

                </div>

            </div>

        }

    </div>

</div>
